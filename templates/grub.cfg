# Minimal Jetson Orin Nano Rescue GRUB Configuration
# Place in /boot/grub/grub.cfg and /EFI/BOOT/grub.cfg

set default="0"
set timeout=5

# Ensure serial console is active for Jetson UART debug cable
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "Jetson Rescue - Direct Kernel Boot (NVMe rootfs)" {
    search --no-floppy --label --set=root APP
    linux /boot/vmlinuz root=/dev/nvme0n1p1 rw rootdelay=30 console=ttyTCU0,115200 console=tty0 fbcon=map:0 net.ifnames=0
    initrd /boot/initrd.img
}

menuentry "Jetson Rescue - USB Live Boot (casper)" {
    search --no-floppy --file --set=root /casper/vmlinuz
    linux /casper/vmlinuz boot=casper rootdelay=60 console=ttyTCU0,115200 console=tty0
    initrd /casper/initrd
}

menuentry "Jetson UEFI Firmware Setup (Reboot to NVRAM Menu)" {
    fwsetup
}

menuentry "System Reboot" {
    reboot
}
